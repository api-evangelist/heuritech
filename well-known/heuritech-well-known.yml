description: >-
  Well-known discovery surface probed across every Heuritech host. The one real find is on
  heuritech.com, which publishes BOTH RFC 8414 OAuth authorization-server metadata and RFC 9728
  OAuth protected-resource metadata pointing at a remote MCP server at
  https://heuritech.com/wp-json/mcp/mcp-oauth-server. Both documents are emitted by the
  WordPress.com Atomic platform the site runs on, not hand-authored by Heuritech, but both are
  served from the company's own host and both are live and correct. No security.txt (RFC 9116),
  no api-catalog (RFC 9727), no OIDC discovery document, no ai-plugin.json and no A2A agent card
  were found on any host.
hosts:
