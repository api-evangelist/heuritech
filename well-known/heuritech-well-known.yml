    status: 200
    content_type: application/json
    file: heuritech-oauth-authorization-server.json
    note: >-
      RFC 8414 — issuer https://heuritech.com, single scope `mcp`, authorization-code + refresh_token,
      PKCE S256 required, public clients (token_endpoint_auth_methods_supported: none), client-ID
      metadata documents supported. Served at the trailing-slash form; the bare path 301s to it.
