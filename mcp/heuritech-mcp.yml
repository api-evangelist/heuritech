  note: >-
    The live tool list and per-tool inputSchema are auth-gated. Heuritech publishes no tool inventory in
    its documentation, has no llms.txt, and the backing wp-abilities/v1 registry is gated the same way, so
    NO tool list is recorded here — deriving one would be fabrication. Authenticated introspection is
    required to enumerate the surface.
companion_surface:
