description: >-
  Heuritech serves a live remote Model Context Protocol server on its primary marketing host. It is
  advertised nowhere in Heuritech's documentation and appears in no MCP registry — it was found by
  probing /.well-known/* on heuritech.com, which returns both RFC 8414 authorization-server metadata
  and RFC 9728 protected-resource metadata, and confirmed by enumerating the `mcp` namespace in the
  WordPress REST route index at https://heuritech.com/wp-json/. The server fronts the Heuritech
  WordPress content estate (marketing site and blog), NOT the commercial Heuritech trend data API.
server:
  name: mcp-oauth-server
  transport: http
  url: https://heuritech.com/wp-json/mcp/mcp-oauth-server
  namespace_index: https://heuritech.com/wp-json/mcp
  protocol: MCP over HTTP (JSON-RPC 2.0)
  methods:
  - POST
  - GET
  - DELETE
  implementation: >-
    WordPress REST namespace `mcp` on the heuritech.com WordPress.com Atomic site, alongside the
    wp-abilities/v1 ability registry the MCP adapter projects as tools. Two routes are registered:
    mcp/mcp-oauth-server (OAuth-protected) and mcp/mcp-adapter-default-server (cookie/application-password
    protected).
  first_party: true
  first_party_note: >-
    Served from heuritech.com, a domain Heuritech owns, but generated by the hosting platform rather
    than authored by Heuritech. Recorded as present because it is live and callable, and qualified
    here so no reader mistakes it for a Heuritech product API.
