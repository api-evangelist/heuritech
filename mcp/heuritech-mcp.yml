  abilities_routes:
  - /wp-abilities/v1/abilities
  - /wp-abilities/v1/abilities/{name}
  - /wp-abilities/v1/abilities/{name}/run
  - /wp-abilities/v1/categories
  note: >-
    The WordPress Abilities API registry is what the MCP adapter projects as tools; it is registered in
    the heuritech.com route index and gated the same way.
related_surfaces:
  openapi: openapi/heuritech-posts-api-openapi.yml
  note: >-
    The MCP server and the derived REST content specs project the same WordPress data core, but the tool
