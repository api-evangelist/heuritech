apis:
- aid: heuritech:heuritech-trend-data-api
  name: Heuritech Trend Data API
  description: >-
    The commercial Heuritech data API, sold as part of the Business and Enterprise plans. Heuritech's own
    product page describes it as "weekly data points on each of our product attributes (prints, colors,
    fabrics, shapes) with up to 6 year historical data and 2 years forecast" and "full access to Heuritech
    unique insights" across 1,000+ trends, so a customer can "inject directly Heuritech market data in your
    own forecasting model". No public developer portal, API reference, base URL, authentication description,
    OpenAPI/AsyncAPI/GraphQL definition or SDK was found for it on any Heuritech host. Access starts with a
    sales demo, so the contract is recorded here as sales-gated rather than guessed at.
  humanURL: https://heuritech.com/heuritech-market-insights/
  tags:
  - Trend Forecasting
  - Fashion
  - Data
  properties:
  - type: Pricing
    url: https://heuritech.com/pricing/
  - type: Plans
    url: plans/heuritech-plans-pricing.yml
  - type: SignUp
    url: https://heuritech.com/get-a-demo/
  x-evidence:
    product_page: https://heuritech.com/heuritech-market-insights/
    http_status: 200
    fetched: '2026-08-17'
    base_url_note: >-
      Heuritech publishes no base URL for the trend data API. api.heuritech.com resolves and returns HTTP
      200, but the body is the customer web application's HTML shell (base href https://www.heuritech.com),
      and every REST/spec discovery path under it returns nginx 404. Recorded without a baseURL rather than
      guessed from the domain.
    spec_probes:
    - url: https://api.heuritech.com/openapi.json
      status: 404
    - url: https://api.heuritech.com/swagger.json
      status: 404
    - url: https://api.heuritech.com/docs
      status: 404
    - url: https://api.heuritech.com/graphql
      status: 404
- aid: heuritech:heuritech-mcp-server
  name: Heuritech MCP Server
  description: >-
    A live remote Model Context Protocol server on the heuritech.com host, advertised through RFC 8414
    OAuth authorization-server metadata and RFC 9728 protected-resource metadata. It is the WordPress MCP
    server that fronts the Heuritech content estate — the marketing site and blog — not the Heuritech trend
    data product. Authorization is OAuth 2.1 authorization-code with PKCE (S256), a single `mcp` scope,
    public clients (token_endpoint_auth_method none) and client-ID metadata documents. An anonymous JSON-RPC
    tools/list returns HTTP 401 mcp_unauthorized with a WWW-Authenticate challenge pointing at the
    protected-resource document, so the live tool schemas require an authorized session.
  humanURL: https://heuritech.com/wp-json/mcp
  baseURL: https://heuritech.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Content
  properties:
  - type: MCPServer
    url: mcp/heuritech-mcp.yml
  - type: ToolCrosswalk
    url: mcp/heuritech-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/heuritech-scopes.yml
  x-evidence:
