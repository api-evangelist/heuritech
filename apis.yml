  detail: >-
    Contract discovery succeeded on the content estate and failed, correctly, on the product.
    heuritech.com serves RFC 8414 and RFC 9728 OAuth metadata for a live remote MCP server at
    /wp-json/mcp/mcp-oauth-server (tools/list gated at 401), and its WordPress REST route index
    yielded 21 anonymously-readable content operations that were derived into OpenAPI. The
