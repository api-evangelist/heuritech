aid: heuritech
name: Heuritech
description: >-
  Heuritech is a Paris-based artificial-intelligence company (Heuritech SAS, RCS Paris B 794 196 055)
  founded in 2013 by two machine-learning PhDs, and since December 2024 part of the Luxurynsight group.
  It applies computer vision and deep-learning demand forecasting to roughly one million social-media
  posts a day from Instagram, Weibo and TikTok, recognising more than 2,000 fashion attributes — prints,
  colours, fabrics, shapes and product details — to quantify and predict consumer demand for apparel,
  footwear and luxury brands up to a year ahead. The product is sold as a SaaS platform and, on the
  Business and Enterprise plans, as a data API delivering weekly data points per product attribute with
  up to six years of history and two years of forecast for injection into a customer's own planning
  models. That commercial API is entirely sales-gated: Heuritech publishes no developer portal, no API
  reference, no base URL and no machine-readable specification for it, and access begins with a demo
  request. The only machine-readable surface a member of the public can reach on heuritech.com is the
  WordPress REST API (wp/v2) that serves the company blog, marketing pages, media library, comments,
  editorial taxonomy and site search as JSON, alongside a live but OAuth-gated WordPress MCP server
  advertised through RFC 8414 and RFC 9728 discovery metadata.
